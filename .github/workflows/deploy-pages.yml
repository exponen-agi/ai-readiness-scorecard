# Publishes the static export to GitHub Pages on every push to main. The first run also turns
# Pages on for the repository (see `enablement` below), so no manual settings step is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pages serves the site under /<repo>, so the export needs to know its own base path.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Next's static export does not emit .nojekyll, and Pages would otherwise drop /_next.
      - run: touch out/.nojekyll
      # `enablement` creates the Pages site on the first run and sets its source to GitHub
      # Actions, using the `pages: write` permission above. Without it the action only reads the
      # existing configuration and fails with "Not Found" on a repository where Pages is off.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
